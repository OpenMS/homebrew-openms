# Installs the published bottles from the tap on Linux and macOS and runs a TOPP tool.
name: install test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/install-test.yml
  schedule:
    - cron: "0 6 * * *"

permissions: {}

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
      - name: Tap and install
        run: |
          brew tap openms/openms
          brew trust openms/openms
          brew install openms/openms/openms
      - name: Run a tool
        run: |
          openms_prefix="$(brew --prefix openms)"
          export PATH="${openms_prefix}/bin:${PATH}"
          FileInfo --help
