# Pull request CI, as generated by `brew tap-new`; bottles are built by build.yml.
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tap-syntax:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homebrew/brew:main # zizmor: ignore[unpinned-images]
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

  # Pull request builds restore the nightly ccache but never save it
  # (caches saved from PR refs are not visible to other runs anyway).
  bottles:
    needs: tap-syntax
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      checks: read
      contents: read
      packages: read
      pull-requests: read
    uses: ./.github/workflows/build.yml
